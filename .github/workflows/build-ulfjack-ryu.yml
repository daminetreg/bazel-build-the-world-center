name: Build ulfjack/ryu
on:
  workflow_dispatch:

jobs:
  bazel-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout generated Bazel files
        uses: actions/checkout@v4

      - name: Record start time
        id: start
        run: echo "time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Clone registered project
        run: git clone --depth 1 https://github.com/ulfjack/ryu.git project

      - name: Overlay generated Bazel files
        run: |
          cp -f "ulfjack/ryu/BUILD" project/BUILD || true
          cp -f "ulfjack/ryu/WORKSPACE" project/WORKSPACE || true
          cp -f "ulfjack/ryu/MODULE.bazel" project/MODULE.bazel || true

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@0.8.5
        with:
          bazelisk-version: 1.x

      - name: Run Bazel build
        id: build
        working-directory: project
        run: bazel build //... 2>&1 | tee /tmp/bazel-output.txt
        continue-on-error: true

      - name: Report build result
        if: always()
        run: |
          PAYLOAD=$(jq -n \
            --arg full "ulfjack/ryu" \
            --arg conclusion "${{ steps.build.outcome }}" \
            --arg started "${{ steps.start.outputs.time }}" \
            --arg updated "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{action:"completed",workflow_run:{repository:{full_name:$full},conclusion:$conclusion,run_started_at:$started,updated_at:$updated}}')
          curl -s -X POST "https://91a04815-bbdd-4aab-a39d-5a2e29cf8715-00-hbeqbks9dcc2.worf.replit.dev/api/github/webhook" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD"
